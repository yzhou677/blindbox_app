# =============================================================================
# Release — signed AAB to Play internal, plus a GitHub Release
# =============================================================================
# This file does not run on pull requests. pr-ci.yml is a separate workflow
# and still builds a debug APK with the stub google-services.json.
#
# Triggers:
#   1. Pushing a tag whose name looks like v1.2.3 (GitHub tag filters are
#      globs, not regex, so v1.2.3-beta also matches the filter). The Dart
#      parser below is the real check and rejects anything that is not
#      exactly vMAJOR.MINOR.PATCH.
#   2. workflow_dispatch from the Actions tab. The branch must be main.
#      The version input must be v1.2.3. Dispatch creates the Git tag via
#      GITHUB_TOKEN. That token does not start a second workflow run, so
#      you do not get a double upload.
#
# versionName comes from the tag. versionCode is 100000 + github.run_number.
# See tools/release/release_version.dart and docs/RELEASE.md for why we do
# not use the pubspec +27 build number and why raw run_number (1, 2, 3…)
# would be rejected by Play.
#
# Secrets (values are never printed):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   GOOGLE_SERVICES_JSON_BASE64, PLAY_SERVICE_ACCOUNT_JSON
# A missing secret fails the job by name right after checkout, before
# Flutter is installed, so that failure shows up in about a minute.
# versionName / versionCode are parsed after Flutter is on PATH and
# before analyze. An illegal tag never starts the test suite.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, exactly vMAJOR.MINOR.PATCH (example v1.2.3)"
        required: true
        type: string
      # Tag pushes have no inputs, so Play status falls back to draft in the
      # upload step (`inputs.play_status || 'draft'`). While the Play Console
      # app itself is still a draft, the API rejects status=completed.
      play_status:
        description: "Play upload status. Use draft while the Play app is still a draft."
        required: true
        type: choice
        default: draft
        options:
          - draft
          - completed

# Creating the GitHub Release needs contents: write. Nothing else is granted.
permissions:
  contents: write

concurrency:
  # Do not cancel a release that is already uploading.
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Analyze, test, Play internal
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ---- Checkout ---------------------------------------------------------
      # fetch-depth 1 is enough. Release notes come from the GitHub API
      # (previous tag → this tag), not from local git history.
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Secrets ----------------------------------------------------------
      # Before JDK / Flutter so a missing secret fails in about a minute.
      # `blank` only checks emptiness. It does not echo the value.
      # `if` so a present secret (the test returns false) does not trip `set -e`.
      - name: Require release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=()
          blank() {
            local value="$1"
            [[ -z "${value//[[:space:]]/}" ]]
          }
          if blank "${ANDROID_KEYSTORE_BASE64}"; then missing+=("ANDROID_KEYSTORE_BASE64"); fi
          if blank "${ANDROID_KEYSTORE_PASSWORD}"; then missing+=("ANDROID_KEYSTORE_PASSWORD"); fi
          if blank "${ANDROID_KEY_ALIAS}"; then missing+=("ANDROID_KEY_ALIAS"); fi
          if blank "${ANDROID_KEY_PASSWORD}"; then missing+=("ANDROID_KEY_PASSWORD"); fi
          if blank "${GOOGLE_SERVICES_JSON_BASE64}"; then missing+=("GOOGLE_SERVICES_JSON_BASE64"); fi
          if blank "${PLAY_SERVICE_ACCOUNT_JSON}"; then missing+=("PLAY_SERVICE_ACCOUNT_JSON"); fi
          if ((${#missing[@]} > 0)); then
            echo "::error::Release stopped before any build. Missing GitHub Actions secret(s): ${missing[*]}."
            echo "Add them in GitHub → Settings → Secrets and variables → Actions."
            echo "How to create each one: docs/RELEASE.md"
            echo "Nothing was uploaded to Play, and no GitHub Release was created."
            exit 1
          fi
          # Raw JSON starts with `{`. Base64 does not. We print only that fact.
          first=$(printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | tr -d '[:space:]' | cut -c1)
          if [[ "$first" != "{" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON must be the raw service-account JSON (it should start with {). Do not base64-encode it. Release stopped."
            exit 1
          fi
          echo "All release secrets are present. Values were not printed."

      # ---- Dispatch guard ---------------------------------------------------
      # A tag can point at any commit on purpose. A button click should not
      # release a feature branch. `$GITHUB_REF` is the runner env var.
      # Do not interpolate `${{ github.ref }}` inside the script.
      - name: Manual release must run from main
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual release must be started from main. This run used $GITHUB_REF. Open Actions → Release → Run workflow and select the main branch."
            exit 1
          fi

      # ---- JDK --------------------------------------------------------------
      # Same pin as pr-ci.yml. android/app/build.gradle.kts targets Java 17.
      # A newer default JDK on the runner makes Android Gradle Plugin fail
      # with a one-line version error.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---- Flutter ----------------------------------------------------------
      # Same pin as pr-ci.yml (local stable). Do not drift one workflow
      # ahead of the other or analyze results will disagree.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show Flutter / Dart versions
        run: |
          flutter --version
          dart --version

      - name: Pub get
        run: flutter pub get

      # ---- Version ----------------------------------------------------------
      # After Flutter is installed (the parser is `dart run`) and before
      # analyze, so a bad tag does not wait on the full test suite.
      # Tag push: RELEASE_REF is refs/tags/v1.2.3.
      # Dispatch: RELEASE_REF is the version input (v1.2.3).
      # The script exits 1 on an empty ref, a branch ref, or an illegal tag.
      # It appends tag / version_name / version_code to GITHUB_OUTPUT.
      - name: Resolve versionName and versionCode
        id: version
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: dart run tools/release/release_version.dart

      # ---- Quality gate -----------------------------------------------------
      # Fail here. Do not continue-on-error. A red analyze or test must not
      # produce an AAB or talk to Play. These steps do not need
      # google-services.json (same fact as pr-ci.yml).
      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test --reporter=compact

      # ---- Signing material -------------------------------------------------
      # android/app/build.gradle.kts reads android/key.properties when the
      # file exists, and otherwise signs release with the debug key.
      # The keystore itself stays in $RUNNER_TEMP, outside the repo tree.
      # storeFile is an absolute path. Gradle `Project.file` keeps absolute
      # paths as-is, so it does not depend on the android/ project root.
      #
      # printf '%s' keeps passwords out of the shell trace. There is no
      # `set -x` in this workflow. The cleanup step deletes these files.
      #
      # google-services.json is the real Firebase Android config. pr-ci.yml
      # copies .github/ci/google-services.ci.json for debug APKs. This job
      # must not do that, or the shipped app would talk to the stub project.
      - name: Write keystore, key.properties, and google-services.json
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file. Check the secret. Release stopped."
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$keystore_path" > android/key.properties
          chmod 600 android/key.properties "$keystore_path"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import json, sys
          path = "android/app/google-services.json"
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception:
              sys.stderr.write("::error::GOOGLE_SERVICES_JSON_BASE64 did not decode to JSON. Release stopped.\n")
              sys.exit(1)
          package = "app.shelfy.collector"
          clients = data.get("client") or []
          ok = any(
              ((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name") == package
              for c in clients
          )
          if not ok:
              sys.stderr.write(
                  "::error::Decoded google-services.json has no Android client for "
                  "app.shelfy.collector. This release does not use the CI stub. Release stopped.\n"
              )
              sys.exit(1)
          print("google-services.json is JSON for app.shelfy.collector. Contents were not printed.")
          PY

      # ---- AAB --------------------------------------------------------------
      # Overrides pubspec for this build only. Does not commit a version bump.
      - name: Build signed app bundle
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name "${{ steps.version.outputs.version_name }}" \
            --build-number "${{ steps.version.outputs.version_code }}"

      # Keep the AAB even if the Play upload fails, so it can be uploaded
      # by hand. The path is the AAB only — not the keystore.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelfy-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.version_code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # ---- Play internal ----------------------------------------------------
      # Pinned to the v1.1.3 commit. That release defaults `track` to
      # production. `internal` is set on purpose. Do not change it to
      # production, beta, or alpha in this workflow.
      # status defaults to draft. Tag pushes have no input, so the `||`
      # fallback applies. A manual run can choose completed only after the
      # Play app itself is published. While the app is still a draft in
      # Play Console, completed is rejected. See docs/RELEASE.md.
      # The first AAB for a brand-new Play app must be uploaded by hand
      # once; the API returns "Package not found" until then.
      - name: Upload AAB to Play internal track
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.shelfy.collector
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status || 'draft' }}

      # ---- GitHub Release ---------------------------------------------------
      # generate_release_notes asks GitHub for PRs merged since the previous
      # tag. The first tag in the repo has no previous tag, so the notes are
      # long. That is expected. The AAB is attached to the release.
      # This step runs only after Play accepted the upload.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shelfy ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: true

      # ---- Cleanup ----------------------------------------------------------
      # Hosted runners are thrown away, but we still delete the files so a
      # later step or a log upload cannot pick them up. always() covers
      # failures after the files were written.
      - name: Delete signing files
        if: always()
        run: |
          set -euo pipefail
          rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks" android/app/google-services.json
          echo "Removed temporary key.properties, keystore, and google-services.json if they were present."
